version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bookbrain-db
    environment:
      POSTGRES_USER: bookbrain
      POSTGRES_PASSWORD: bookbrain
      POSTGRES_DB: bookbrain
    ports:
      - "${BOOKBRAIN_DB_BIND:-127.0.0.1:5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookbrain"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BOOKBRAIN_AUTO_AI_PROCESS: ${NEXT_PUBLIC_BOOKBRAIN_AUTO_AI_PROCESS:-false}
    container_name: bookbrain-app
    ports:
      - "${BOOKBRAIN_APP_PORT:-3200}:3000"
    environment:
      DATABASE_URL: postgresql://bookbrain:bookbrain@postgres:5432/bookbrain
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      BOOKBRAIN_AUTH_USER: ${BOOKBRAIN_AUTH_USER:-admin}
      BOOKBRAIN_AUTH_PASSWORD: ${BOOKBRAIN_AUTH_PASSWORD}
      BOOKBRAIN_LOGIN_CODE: ${BOOKBRAIN_LOGIN_CODE}
      BOOKBRAIN_EXTENSION_TOKEN: ${BOOKBRAIN_EXTENSION_TOKEN}
      NEXT_PUBLIC_BOOKBRAIN_AUTO_AI_PROCESS: ${NEXT_PUBLIC_BOOKBRAIN_AUTO_AI_PROCESS:-false}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
