version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bookbrain-db
    environment:
      POSTGRES_USER: bookbrain
      POSTGRES_PASSWORD: bookbrain
      POSTGRES_DB: bookbrain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookbrain"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookbrain-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://bookbrain:bookbrain@postgres:5432/bookbrain
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
